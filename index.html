<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LiD Test Trainer</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single column study app — topic list → topic (facts + quiz) → mock test. Ink-navy civic paper with a Bundesadler-gold accent. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#18213a; --muted:#5b6478; --line:#dfe2ea;
  --accent:#c99a1b; --accent-ink:#5a4306; --accent-soft:#f6ecd0;
  --good:#1f7a4a; --good-soft:#e3f3ea; --bad:#b3261e; --bad-soft:#fbe6e4;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141f; --surface:#191f2e; --ink:#e8ebf3; --muted:#9aa3b8; --line:#2b3346;
  --accent:#e2b743; --accent-ink:#f3d98c; --accent-soft:#2e2814;
  --good:#5fcf92; --good-soft:#16301f; --bad:#f08a80; --bad-soft:#3a1b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141f; --surface:#191f2e; --ink:#e8ebf3; --muted:#9aa3b8; --line:#2b3346;
  --accent:#e2b743; --accent-ink:#f3d98c; --accent-soft:#2e2814;
  --good:#5fcf92; --good-soft:#16301f; --bad:#f08a80; --bad-soft:#3a1b19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.4rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.countdown{display:inline-flex;align-items:baseline;gap:8px;background:var(--accent-soft);color:var(--accent-ink);padding:6px 12px;border-radius:999px;font-weight:600;width:fit-content}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:focus-visible,.opt:focus-visible,.topic:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:default}
.mock{background:var(--ink);color:var(--bg);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;margin:18px 0}
.mock p{margin:0;opacity:.85}
.mock .btn{background:var(--accent);color:#1a1405;border-color:var(--accent);width:fit-content}
.topics{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.topic{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;color:var(--ink)}
.topic .de{font-family:var(--display);font-weight:600;font-size:1.1rem}
.topic .en{color:var(--muted);font-size:.92rem;grid-column:1}
.topic .score{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;width:72px;margin-top:4px;margin-left:auto}
.bar i{display:block;height:100%;background:var(--good)}
.tabs{display:flex;gap:6px;margin:14px 0}
.tab{border:1px solid var(--line);background:none;color:var(--muted);padding:7px 14px;border-radius:999px;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.facts{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.fact{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:5.2rem 1fr;gap:12px}
.fact:last-child{border-bottom:0}
.fact .k{font-family:var(--mono);font-size:.85rem;color:var(--accent-ink);font-weight:500;padding-top:2px}
.fact .v{min-width:0}
.fact .v b{font-weight:700}
.fact .v small{display:block;color:var(--muted);font-size:.88rem}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted)}
.qde{font-size:1.15rem;font-weight:700;line-height:1.35}
.qen{color:var(--muted);font-size:.95rem;margin-top:4px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:12px 14px;border-radius:10px;display:grid;grid-template-columns:1.6rem 1fr;gap:6px;align-items:start}
.opt .l{font-family:var(--mono);color:var(--muted)}
.opt.sel{border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.explain{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:.96rem}
.explain b{color:var(--good)}
.explain.no b{color:var(--bad)}
.back{background:none;border:0;color:var(--muted);padding:0;font-weight:600;margin-bottom:10px}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums}
.result{text-align:center;padding:26px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;align-items:center}
.big{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1}
.pass{color:var(--good)} .fail{color:var(--bad)}
.review{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.rv{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:12px 14px;font-size:.95rem}
.rv .ok{color:var(--good);font-weight:700}
.toggle{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--muted)}
.note{font-size:.88rem;color:var(--muted);margin-top:22px}
a{color:var(--accent-ink)}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dots i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.dots i.r{background:var(--good)} .dots i.w{background:var(--bad)} .dots i.c{outline:2px solid var(--ink)}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .15s,background .15s}}
</style>

<div class="wrap" id="app"></div>

<style>
.pics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end}
.pics figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--muted)}
.pics img{max-height:84px;width:auto;max-width:100%;object-fit:contain}
.onepic{display:flex;justify-content:center}
.onepic img{max-height:300px;width:auto;max-width:100%;border-radius:8px;background:#fff}
.nr{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.ea{color:var(--muted)}
.overall{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted);margin-top:4px}
.overall .bar{width:140px;margin:0}
.opt .oe{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.vocab{width:100%;border-collapse:collapse;font-size:.92rem}
.vwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.vocab th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.vocab td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.vocab tr:last-child td{border-bottom:0}
.vocab td:first-child{font-weight:600;white-space:nowrap}
.vh{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:4px 0 6px}
.bm{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.bm[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.bm svg{width:13px;height:13px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
details.rvd summary{cursor:pointer;color:var(--muted);font-size:.88rem;margin-top:6px}
.startbox{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
</style>
<script>
const DATA={"Q":[{"n":1,"t":"gg","q":"In Deutschland dürfen Menschen offen etwas gegen die Regierung sagen, weil …","o":["hier Religionsfreiheit gilt.","die Menschen Steuern zahlen.","die Menschen das Wahlrecht haben.","hier Meinungsfreiheit gilt."],"a":3,"e":"In Germany people may openly criticise the government because …","ea":"freedom of opinion applies here","im":null,"oe":["freedom of religion applies here","people pay taxes","people have the right to vote","freedom of opinion applies here"],"v":[["offen","openly"],["die Regierung","government"],["die Religionsfreiheit","freedom of religion"],["die Steuern","taxes"],["das Wahlrecht","right to vote"],["die Meinungsfreiheit","freedom of opinion"]]},{"n":2,"t":"gg","q":"In Deutschland können Eltern bis zum 14. Lebensjahr ihres Kindes entscheiden, ob es in der Schule am …","o":["Geschichtsunterricht teilnimmt.","Religionsunterricht teilnimmt.","Politikunterricht teilnimmt.","Sprachunterricht teilnimmt."],"a":1,"e":"Until the child turns 14, parents can decide whether it takes part in …","ea":"religious education","im":null,"oe":["takes part in history lessons","takes part in religious education","takes part in politics lessons","takes part in language lessons"],"v":[["das Lebensjahr","year of life (age)"],["entscheiden","to decide"],["teilnehmen","to take part"],["der Unterricht","lessons, class"],["der Geschichtsunterricht","history class"],["der Religionsunterricht","religious education"]]},{"n":3,"t":"gg","q":"Deutschland ist ein Rechtsstaat. Was ist damit gemeint?","o":["Alle Einwohnerinnen/Einwohner und der Staat müssen sich an die Gesetze halten.","Der Staat muss sich nicht an die Gesetze halten.","Nur Deutsche müssen die Gesetze befolgen.","Die Gerichte machen die Gesetze."],"a":0,"e":"Germany is a 'Rechtsstaat' (rule of law). What does that mean?","ea":"Everyone, including the state, must obey the laws","im":null,"oe":["All residents and the state must obey the laws","The state does not have to obey the law etz"],"a":3,"e":"What is the German constitution called?","ea":"Grundgesetz (Basic Law)","im":null,"oe":["People's Law","Federal Law","German Law","Basic Law"],"v":[["die Verfassung","constitution"],["das Volk","people, nation"],["der Bund","federation"],["das Gesetz","law"],["das Grundgesetz","Basic Law (German constitution)"]]},{"n":7,"t":"gg","q":"Welches Recht gehört zu den Grundrechten, die nach der deutschen Verfassung garantiert werden? Das Recht auf …","o":["Glaubens- und Gewissensfreiheit","Unterhaltung","Arbeit","Wohnung"],"a":0,"e":"Which right is guaranteed by the constitution? The right to …","ea":"freedom of faith and conscience","im":null,"oe":["freedom of faith and conscience","entertainment","work","housing"],"v":[["garantieren","to guarantee"],["der Glaube","faith"],["das Gewissen","conscience"],["die Unterhaltung","entertainment"],["die Arbeit","work"],["die Wohnung","flat, housing"]]},{"n":8,"t":"gg","q":"Was steht nicht im Grundgesetz von Deutschland?","o":["Die Würde des Menschen ist unantastbar.","Alle sollen gleich viel Geld haben.","Jeder Mensch darf seine Meinung sagen.","Alle sind vor dem Gesetz gleich."],"a":1,"e":"What is NOT in the Basic Law?","ea":"Everyone should have the same amount of money","im":null,"oe":["Human dignity is inviolable.","Everyone should have the same amount of money.","Everyone may say their opinion.","All are equal before the law."],"v":[["die Würde","dignity"],["unantastbar","inviolable"],["gleich viel","the same amount"],["die Meinung","opinion"],["vor dem Gesetz","before the law"]]},{"n":9,"t":"gg","q":"Welches Grundrecht gilt in Deutschland nur für Ausländerinnen/Ausländer? Das Grundrecht auf …","o":["Schutz der Familie","Menschenwürde","Asyl","Meinungsfreiheit"],"a":2,"e":"Which basic right applies only to foreigners?","ea":"asylum","im":null,"oe":["protection of the family","human dignity","asylum","freedom of opinion"],"v":[["nur","only"],["der Ausländer","foreigner"],["der Schutz","protection"],["die Familie","family"],["die Menschenwürde","human dignity"],["das Asyl","asylum"]]},{"n":10,"t":"gg","q":"Was ist mit dem deutschen Grundgesetz vereinbar?","o":["die Prügelstrafe","die Folter","die Todesstrafe","die Geldstrafe"],"a":3,"e":"What is compatible with the Basic Law?","ea":"a fine (monetary penalty)","im":null,"oe":["corporal punishment","torture","the death penalty","a fine"],"v":[["vereinbar","compatible"],["die Prügelstrafe","corporal punishment (beating)"],["die Folter","torture"],["die Todesstrafe","death penalty"],["die Geldstrafe","fine (money penalty)"]]},{"n":11,"t":"gg","q":"Wie wird die Verfassung der Bundesrepublik Deutschland genannt?","o":["Grundgesetz","Bundesverfassung","Gesetzbuch","Verfassungsvertrag"],"a":0,"e":"What is the constitution of the FRG called?","ea":"Grundgesetz","im":null,"oe":["Basic Law","Federal Constitution","Code of law","Constitutional treaty"],"v":[["genannt","called"],["die Bundesverfassung","federal constitution"],["das Gesetzbuch","legal code"],["der Vertrag","treaty, contract"]]},{"n":12,"t":"gg","q":"Eine Partei im Deutschen Bundestag will die Pressefreiheit abschaffen. Ist das möglich?","o":["Ja, wenn mehr als die Hälfte der Abgeordneten im Bundestag dafür sind.","Ja, aber dazu müssen zwei Drittel der Abgeordneten im Bundestag dafür sein.","Nein, denn die Pressefreiheit ist ein Grundrecht. Sie kann nicht abgeschafft werden.","Nein, denn nur der Bundesrat kann die Pressefreiheit abschaffen."],"a":2,"e":"A party wants to abolish press freedom. Is that possible?","ea":"No, it is a basic right and cannot be abolished","im":null,"oe":["Yes, if more than half of the MPs in the Bundestag agree.","Yes, but two thirds of the MPs in the Bundestag must agree.","No, press freedom is a basic right. It cannot be abolished.","No, only the Bundesrat can abolish press freedom."],"v":[["die Partei","party"],["abschaffen","to abolish"],["die Pressefreiheit","freedom of the press"],["möglich","possible"],["die Hälfte","half"],["der Abgeordnete","member of parliament"],["zwei Drittel","two thirds"]]},{"n":13,"t":"gg","q":"Im Parlament steht der Begriff \"Opposition\" für …","o":["die regierenden Parteien.","die Fraktion mit den meisten Abgeordneten.","alle Parteien, die bei der letzten Wahl die 5%-Hürde erreichen konnten.","alle Abgeordneten, die nicht zu der Regierungspartei/den Regierungsparteien gehören."],"a":3,"e":"In parliament, 'opposition' means …","ea":"all MPs not belonging to the governing party/parties","im":null,"oe":["the governing parties","the parliamentary group with the most MPs","all parties that passed the 5% hurdle at the last election","all MPs who do not belong to the governing party/parties"],"v":[["der Begriff","term"],["stehen für","to stand for"],["regieren","to govern"],["die Fraktion","parliamentary group"],["erreichen","to reach"],["gehören zu","to belong to"]]},{"n":14,"t":"gg","q":"Meinungsfreiheit in Deutschland heißt, dass ich …","o":["Passanten auf der Straße beschimpfen darf.","meine Meinung im Internet äußern kann.","Nazi-, Hamas- oder Islamischer Staat-Symbole öffentlich tragen darf.","meine Meinung nur dann äußern darf, solange ich der Regierung nicht widerspreche."],"a":1,"e":"Freedom of opinion means I …","ea":"can express my opinion on the internet","im":null,"oe":["may insult passers-by in the street","can express my opinion on the internet","may wear Nazi, Hamas or Islamic State symbols in public","may only express my opinion as long as I don't contradict the government"],"v":[["der Passant","passer-by"],["beschimpfen","to insult, verbally abuse"],["äußern","to express"],["öffentlich","in public"],["tragen","to wear"],["widersprechen","to contradict"]]},{"n":15,"t":"gg","q":"Was verbietet das deutsche Grundgesetz?","o":["Militärdienst","Zwangsarbeit","freie Berufswahl","Arbeit im Ausland"],"a":1,"e":"What does the Basic Law forbid?","ea":"forced labour","im":null,"oe":["military service","forced labour","free choice of profession","working abroad"],"v":[["v const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let stats=store.get("lid2-stats",{});
let showEN=store.get("lid-en",true);
let bms=new Set(store.get("lid2-bm",[]).map(String));
const isBm=q=>bms.has(String(q.n));
const toggleBm=q=>{const k=String(q.n);bms.has(k)?bms.delete(k):bms.add(k);store.set("lid2-bm",[...bms])};
const BM_SVG='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>';
const EXAM=new Date("2026-11-25T00:00:00");
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let timer=null;
const daysLeft=()=>{const n=new Date();n.setHours(0,0,0,0);return Math.round((EXAM-n)/864e5)};
const score=list=>({n:list.length,right:list.filter(q=>stats[q.n]&&stats[q.n].r).length});
const save=(q,ok)=>{stats[q.n]={r:ok};store.set("lid2-stats",stats)};
const tName=id=>TOPICS.find(t=>t.id===id).de;

function pic(q){
  if(!q.im)return"";const v=IM[q.im];
  if(Array.isArray(v))return `<div class="pics">${v.map((s,k)=>`<figure><img src="${s}" alt="Bild ${k+1}"><span>Bild ${k+1}</span></figure>`).join("")}</div>`;
  return `<div class="onepic"><img src="${v}" alt="Abbildung zur Frage"></div>`;
}
function bmBtn(q){return `<button class="bm" data-bm="${esc(q.n)}" aria-pressed="${isBm(q)}">${BM_SVG}<span>${isBm(q)?"Bookmarked":"Bookmark"}</span></button>`}
function wireBm(root,q){const b=root.querySelector('[data-bm]');if(!b)return;b.onclick=()=>{toggleBm(q);b.setAttribute("aria-pressed",isBm(q));b.querySelector("span").textContent=isBm(q)?"Bookmarked":"Bookmark"}}
function vocabTable(q){return `<div><div class="vh">Vocabulary</div><div class="vwrap"><table class="vocab"><thead><tr><th>Deutsch</th><th>English</th></tr></thead><tbody>${q.v.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table></div></div>`}
function qHead(q,i,len){
  return `<div class="qmeta"><span class="mono">${i+1} / ${len}</span><span class="nr">Nr. ${q.n} · ${esc(tName(q.t))}</span></div>
  <div class="qtop"><div style="min-width:0;flex:1"><div class="qde">${esc(q.q)}</div>${showEN?`<div class="qen">${esc(q.e)}</div>`:""}</div>${bmBtn(q)}</div>${pic(q)}`;
}

function home(){
  clearInterval(timer);
  const d=daysLeft(),all=score(Q),wrong=Q.filter(q=>stats[q.n]&&!stats[q.n].r).length;
  app.innerHTML=`
  <header class="top">
    <span class="eyebrow">Leben in Deutschland · Bayern · official catalogue</span>
    <h1>LiD Test Trainer</h1>
    <span class="countdown"><span class="mono">${Math.max(d,0)}</span> ${d===1?"day":"days"} until 25 November</span>
    <div class="overall"><span class="bar"><i style="width:${Math.round(all.right/all.n*100)}%"></i></span><span class="mono">${all.right}/${all.n}</span> answered correctly</div>
  </header>
  <section class="mock">
    <span class="eyebrow" style="color:inherit;opacity:.7">Mock test</span>
    <h2>33 questions · 60 minutes</h2>
    <p>30 general + 3 Bavaria from the official catalogue. Pass mark 17.</p>
    <button class="btn" id="mk">Start mock test</button>
  </section>
  <div class="row" style="justify-content:space-between;margin:6px 0 8px">
    <h2>Topics</h2>
    <label class="toggle"><input type="checkbox" id="en" ${showEN?"checked":""}> English help</label>
  </div>
  <div class="topics">${TOPICS.map(t=>{const s=score(Q.filter(q=>q.t===t.id));return `
    <button class="topic" data-t="${t.id}">
      <span class="de">${esc(t.de)}</span><span class="en">${esc(t.en)} · ${s.n} questions</span>
      <span class="score">${s.right}/${s.n}<span class="bar"><i style="width:${Math.round(s.right/s.n*100)}%"></i></span></span>
    </button>`}).join("")}</div>
  <div class="row" style="margin-top:16px">
    <button class="btn" id="bmk" ${bms.size?"":"disabled"}>Bookmarked (${bms.size})</button>
    <button class="btn" id="mist" ${wrong?"":"disabled"}>Practise my mistakes (${wrong})</button>
    <button class="btn" id="new">Unseen questions (${Q.filter(q=>!stats[q.n]).length})</button>
    <button class="btn" id="rst">Reset progress</button>
  </div>
  <p class="note">All 300 general questions and the 10 Bavaria questions from the BAMF catalogue (as of 07.05.2025). The catalogue doesn't mark answers, so the answer key and English translations were added for this app. Questions about current office holders (Nr. 72, 73, 75) can change, so check the news before the exam.</p>`;
  app.querySelector("#mk").onclick=mock;
  app.querySelector("#en").onchange=e=>{showEN=e.target.checked;store.set("lid-en",showEN)};
  app.querySelectorAll(".topic").forEach(b=>b.onclick=()=>topic(b.dataset.t,"facts"));
  app.querySelector("#mist").onclick=()=>quiz(shuffle(Q.filter(q=>stats[q.n]&&!stats[q.n].r)),"My mistakes");
  app.querySelector("#bmk").onclick=()=>quiz(Q.filter(isBm),"Bookmarked questions");
  app.querySelector("#new").onclick=()=>quiz(shuffle(Q.filter(q=>!stats[q.n])).slice(0,20),"20 unseen questions");
  const r=app.querySelector("#rst");r.onclick=()=>{if(r.dataset.c){stats={};store.set("lid2-stats",stats);home()}else{r.dataset.c=1;r.textContent="Tap again to confirm"}};
  window.scrollTo(0,0);
}

function topic(id,tab){
  const t=TOPICS.find(x=>x.id===id),qs=Q.filter(q=>q.t===id),s=score(qs);
  app.innerHTML=`<button class="back" id="bk">← All topics</button>
  <span class="eyebrow">${esc(t.en)}</span><h1 style="margin-top:4px">${esc(t.de)}</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="${tab==="facts"}" id="tf">Key facts</button>
    <button class="tab" role="tab" aria-selected="${tab==="quiz"}" id="tq">Questions (${qs.length})</button>
  </div><div id="body"></div>`;
  app.querySelector("#bk").onclick=home;
  app.querySelector("#tf").onclick=()=>topic(id,"facts");
  app.querySelector("#tq").onclick=()=>topic(id,"quiz");
  const body=app.querySelector("#body");
  if(tab==="facts"){
    body.innerHTML=`<div class="facts">${t.facts.map(f=>`<div class="fact"><span class="k">${f[0]}</span><span class="v">${f[1]}${f[2]?`<small>${f[2]}</small>`:""}</span></div>`).join("")}</div>
    <div class="row" style="margin-top:16px"><button class="btn primary" id="go">Practise these questions →</button></div>`;
    body.querySelector("#go").onclick=()=>topic(id,"quiz");
  } else {
    const wrong=qs.filter(q=>stats[q.n]&&!stats[q.n].r),unseen=qs.filter(q=>!stats[q.n]);
    body.innerHTML=`<div class="startbox">
      <span class="muted"><span class="mono">${s.right}/${s.n}</span> correct so far · ${unseen.length} not tried yet</span>
      <div class="row">
        <button class="btn primary" id="b10">10 random</button>
        <button class="btn" id="ball">All ${qs.length} in catalogue order</button>
        <button class="btn" id="bun" ${unseen.length?"":"disabled"}>Not tried yet</button>
        <button class="btn" id="bwr" ${wrong.length?"":"disabled"}>My mistakes (${wrong.length})</button>
        <button class="btn" id="bbm" ${qs.filter(isBm).length?"":"disabled"}>Bookmarked (${qs.filter(isBm).length})</button>
      </div></div>`;
    const back=()=>topic(id,"quiz");
    body.querySelector("#b10").onclick=()=>quiz(shuffle(qs).slice(0,10),t.de,back);
    body.querySelector("#ball").onclick=()=>quiz(qs,t.de,back);
    body.querySelector("#bun").onclick=()=>quiz(unseen,t.de,back);
    body.querySelector("#bwr").onclick=()=>quiz(shuffle(wrong),t.de,back);
    body.querySelector("#bbm").onclick=()=>quiz(qs.filter(isBm),t.de,back);
  }
  window.scrollTo(0,0);
}

function quiz(list,title,onBack){
  let i=0,right=0;onBack=onBack||home;
  app.innerHTML=`<button class="back" id="bk">← Back</button><h1>${esc(title)}</h1><div id="body" style="margin-top:14px"></div>`;
  app.querySelector("#bk").onclick=onBack;
  const body=app.querySelector("#body");
  function render(){
    if(i>=list.length){
      body.innerHTML=`<div class="result"><span class="eyebrow">Done</span><span class="big mono">${right}/${list.length}</span><span class="muted">${right===list.length?"All correct.":"Wrong answers are saved under ‘My mistakes’."}</span>
      <div class="row" style="justify-content:center;margin-top:8px"><button class="btn primary" id="again">Again</button><button class="btn" id="home">Back</button></div></div>`;
      body.querySelector("#again").onclick=()=>{list=shuffle(list);i=0;right=0;render()};
      body.querySelector("#home").onclick=onBack;return;
    }
    const q=list[i];
    body.innerHTML=`<div class="qcard">${qHead(q,i,list.length)}
      <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${"abcd"[k]}</span><span>${esc(o)}<span class="oe" hidden>${esc(q.oe[k])}</span></span></button>`).join("")}</div>
      <div id="fb"></div></div>`;
    wireBm(body,q);
    body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(body.querySelector(".opt.right"))return;
      const ok=+b.dataset.k===q.a;if(ok)right++;save(q,ok);
      body.querySelectorAll(".opt")[q.a].classList.add("right");
      body.querySelectorAll(".oe").forEach(e=>e.hidden=false);
      if(!ok)b.classList.add("wrong");
      body.querySelector("#fb").innerHTML=`<div class="explain ${ok?"":"no"}"><b>${ok?"Richtig":"Falsch"}.</b> ${ok?"":esc(q.o[q.a])+" "}<span class="ea">(${esc(q.ea)})</span></div>
      ${vocabTable(q)}
      <div class="row" style="margin-top:12px"><button class="btn primary" id="nx">${i+1<list.length?"Next":"Finish"}</button></div>`;
      const nx=body.querySelector("#nx");nx.onclick=()=>{i++;render();window.scrollTo(0,0)};nx.focus({preventScroll:true});
    });
  }
  render();window.scrollTo(0,0);
}

function mock(){
  clearInterval(timer);
  const list=shuffle(Q.filter(q=>q.t!=="by")).slice(0,30).concat(shuffle(Q.filter(q=>q.t==="by")).slice(0,3)).map(q=>({q,pick:null}));
  let i=0;const end=Date.now()+60*60*1000;
  app.innerHTML=`<div class="row" style="justify-content:space-between"><button class="back" id="bk" style="margin:0">← Quit</button><span class="timer" id="tm">60:00</span></div>
  <h1 style="margin:8px 0 10px">Mock test</h1><div class="dots" id="dots"></div><div id="body" style="margin-top:14px"></div>`;
  app.querySelector("#bk").onclick=home;
  const body=app.querySelector("#body"),tm=app.querySelector("#tm"),dots=app.querySelector("#dots");
  timer=setInterval(()=>{const s=Math.max(0,Math.round((end-Date.now())/1000));tm.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");if(!s)finish()},1000);
  function render(){
    dots.innerHTML=list.map((x,n)=>`<i class="${n===i?"c":""}" style="${x.pick!==null?"background:var(--muted)":""}"></i>`).join("");
    const it=list[i],q=it.q;
    body.innerHTML=`<div class="qcard">${qHead(q,i,33).replace(/Nr\. [^<]*/,i>=30?"Bayern":"Allgemein")}
      <div class="opts">${q.o.map((o,k)=>`<button class="opt ${it.pick===k?"sel":""}" data-k="${k}"><span class="l">${"abcd"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div class="row" style="justify-content:space-between">
        <button class="btn" id="pv" ${i?"":"disabled"}>← Back</button>
        ${i<32?`<button class="btn primary" id="nx">Next →</button>`:`<button class="btn primary" id="fin">Hand in</button>`}
      </div></div>`;
    wireBm(body,q);
    body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{it.pick=+b.dataset.k;if(i<32)i++;render();window.scrollTo(0,0)});
    body.querySelector("#pv").onclick=()=>{i--;render()};
    const nx=body.querySelector("#nx");if(nx)nx.onclick=()=>{i++;render()};
    const fin=body.querySelector("#fin");if(fin)fin.onclick=finish;
  }
  function finish(){
    clearInterval(timer);
    let sc=0;list.forEach(x=>{const ok=x.pick===x.q.a;if(ok)sc++;save(x.q,ok)});
    const pass=sc>=17,miss=list.filter(x=>x.pick!==x.q.a);
    app.innerHTML=`<button class="back" id="bk">← All topics</button>
    <div class="result"><span class="eyebrow">Mock test result</span>
      <span class="big mono ${pass?"pass":"fail"}">${sc}/33</span>
      <strong class="${pass?"pass":"fail"}">${pass?"Bestanden, passed":"Not yet, 17 needed"}</strong>
      <span class="muted">${sc>=30?"Exam-ready level.":"Aim for 30+ consistently before the exam."}</span>
      <div class="row" style="justify-content:center;margin-top:8px"><button class="btn primary" id="again">New mock test</button></div></div>
    ${miss.length?`<h2 style="margin-top:22px">Review (${miss.length})</h2><div class="review">${miss.map(x=>`<div class="rv"><span class="nr">Nr. ${x.q.n}</span><br><strong>${esc(x.q.q)}</strong>${showEN?`<div class="muted">${esc(x.q.e)}</div>`:""}<div style="margin-top:6px">${x.pick===null?"Not answered. ":"Your answer: "+esc(x.q.o[x.pick])+". "}<span class="ok">Correct: ${esc(x.q.o[x.q.a])}</span></div><div class="muted" style="margin-top:4px">${esc(x.q.ea)}</div>
      <details class="rvd"><summary>All options in English + vocabulary</summary><ol type="a" style="margin:8px 0;padding-left:1.4em">${x.q.o.map((o,k)=>`<li><strong>${esc(o)}</strong>, ${esc(x.q.oe[k])}</li>`).join("")}</ol>${vocabTable(x.q)}</details>
      <div style="margin-top:8px">${bmBtn(x.q)}</div></div>`).join("")}</div>`:""}`;
    app.querySelectorAll("[data-bm]").forEach(b=>{const q=Q.find(z=>String(z.n)===b.dataset.bm);b.onclick=()=>{toggleBm(q);b.setAttribute("aria-pressed",isBm(q));b.querySelector("span").textContent=isBm(q)?"Bookmarked":"Bookmark"}});
    app.querySelector("#bk").onclick=home;app.querySelector("#again").onclick=mock;window.scrollTo(0,0);
  }
  render();
}
home();
</script>
