name: React trainer validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/react-typescript-rebuild]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run TypeScript and production build
        run: npm run build
      - name: Run tests
        run: npm test
